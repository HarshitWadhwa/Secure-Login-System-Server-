services:
  - type: web
    name: secure-login-system
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DB_PATH
        value: /opt/render/project/src/data/database.sqlite
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: secure-login-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1